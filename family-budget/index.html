<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Семейный бюджет</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .balance-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .balance-title {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: bold;
            color: #333;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 15px;
        }

        .stat-box {
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .income-box {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .expense-box {
            background: #ffebee;
            color: #c62828;
        }

        .stat-label {
            font-size: 12px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }

        .add-btn {
            width: 100%;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
            transition: transform 0.2s;
        }

        .add-btn:active {
            transform: scale(0.98);
        }

        .transactions {
            margin-top: 30px;
        }

        .transactions h2 {
            color: white;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .transaction-list {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .transaction-date {
            font-size: 12px;
            color: #999;
        }

        .transaction-amount {
            font-weight: bold;
            font-size: 18px;
        }

        .transaction-amount.income {
            color: #2e7d32;
        }

        .transaction-amount.expense {
            color: #c62828;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
        }

        .modal-title {
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .type-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            background: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .type-btn.income.active {
            background: #e8f5e9;
            border-color: #4CAF50;
            color: #2e7d32;
        }

        .type-btn.expense.active {
            background: #ffebee;
            border-color: #f44336;
            color: #c62828;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Семейный бюджет</h1>
        </div>

        <div class="balance-card">
            <div class="balance-title">Общий баланс</div>
            <div class="balance-amount" id="balance">0 ₽</div>
            <div class="stats-row">
                <div class="stat-box income-box">
                    <div class="stat-label">Доходы</div>
                    <div class="stat-value" id="totalIncome">0 ₽</div>
                </div>
                <div class="stat-box expense-box">
                    <div class="stat-label">Расходы</div>
                    <div class="stat-value" id="totalExpense">0 ₽</div>
                </div>
            </div>
        </div>

        <button class="add-btn" onclick="openModal()">+ Добавить операцию</button>

        <div class="transactions">
            <h2>История операций</h2>
            <div class="transaction-list" id="transactionList">
                <div class="empty-state">Пока нет операций</div>
            </div>
        </div>
    </div>

    <div class="modal" id="transactionModal">
        <div class="modal-content">
            <h2 class="modal-title">Новая операция</h2>
            
            <div class="type-selector">
                <button class="type-btn income active" data-type="income">Доход</button>
                <button class="type-btn expense" data-type="expense">Расход</button>
            </div>

            <div class="form-group">
                <label>Название</label>
                <input type="text" id="title" placeholder="Например: Зарплата">
            </div>

            <div class="form-group">
                <label>Сумма (₽)</label>
                <input type="number" id="amount" placeholder="0" min="0">
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn btn-primary" onclick="addTransaction()">Добавить</button>
            </div>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        let currentType = 'income';

        function updateUI() {
            const balanceEl = document.getElementById('balance');
            const totalIncomeEl = document.getElementById('totalIncome');
            const totalExpenseEl = document.getElementById('totalExpense');
            const transactionList = document.getElementById('transactionList');

            const income = transactions
                .filter(t => t.type === 'income')
                .reduce((sum, t) => sum + t.amount, 0);

            const expense = transactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + t.amount, 0);

            const balance = income - expense;

            balanceEl.textContent = `${balance.toLocaleString()} ₽`;
            totalIncomeEl.textContent = `+${income.toLocaleString()} ₽`;
            totalExpenseEl.textContent = `-${expense.toLocaleString()} ₽`;

            if (transactions.length === 0) {
                transactionList.innerHTML = '<div class="empty-state">Пока нет операций</div>';
            } else {
                transactionList.innerHTML = transactions
                    .slice()
                    .reverse()
                    .map(t => `
                        <div class="transaction-item">
                            <div class="transaction-info">
                                <div class="transaction-title">${t.title}</div>
                                <div class="transaction-date">${new Date(t.date).toLocaleDateString('ru-RU')}</div>
                            </div>
                            <div class="transaction-amount ${t.type}">
                                ${t.type === 'income' ? '+' : '-'}${t.amount.toLocaleString()} ₽
                            </div>
                        </div>
                    `).join('');
            }

            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        function openModal() {
            document.getElementById('transactionModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('transactionModal').classList.remove('active');
            document.getElementById('title').value = '';
            document.getElementById('amount').value = '';
        }

        function addTransaction() {
            const title = document.getElementById('title').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);

            if (!title || !amount || amount <= 0) {
                alert('Пожалуйста, заполните все поля корректно');
                return;
            }

            const transaction = {
                id: Date.now(),
                title,
                amount,
                type: currentType,
                date: new Date().toISOString()
            };

            transactions.push(transaction);
            updateUI();
            closeModal();
        }

        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
            });
        });

        document.getElementById('transactionModal').addEventListener('click', (e) => {
            if (e.target.id === 'transactionModal') {
                closeModal();
            }
        });

        updateUI();

        // Service Worker Registration for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
